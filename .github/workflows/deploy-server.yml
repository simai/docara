name: Deploy to the simai server

# Builds Docara's own documentation (docs/site) as https://docara.simai.io/ and
# deploys it to the simai-env server (201.51.24.222) after the Documentation
# site workflow succeeds on a push to main, or on a manual run. It does nothing
# until the repository variable SIMAI_SERVER_DEPLOY is "true" and the
# environment simai-server holds SIMAI_DEPLOY_KEY (a key the server's deploy
# gate lets deploy docara.simai.io only) and SIMAI_DEPLOY_KNOWN_HOSTS. GitHub
# Pages stays as the fallback.

on:
  workflow_run:
    workflows: [Documentation site]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simai-server
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.SIMAI_SERVER_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: simai-server
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      # The site has its own domain, so it is served from the root. The
      # committed docara.json keeps "/" and no site_url for local builds.
      - name: Set the site base URL and site URL
        working-directory: docs/site
        run: |
          jq --arg base "/" --arg site "https://docara.simai.io/" \
            '.base_url = $base | .site_url = $site' docara.json > docara.json.server
          mv docara.json.server docara.json
          jq -r '.base_url, .site_url' docara.json
      - run: env -u SIMAI_UI_ROOT php ../../docara build production
        working-directory: docs/site
      - run: php ../../docara verify-static build_production
        working-directory: docs/site
      - name: Deploy the artifact
        env:
          DEPLOY_KEY: ${{ secrets.SIMAI_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SIMAI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          out=docs/site/build_production
          mkdir -p "$out/.simai"
          printf '%s\n' '{"schema":"simai-app/1","profile":"static","health":{"path":"/ru/"}}' > "$out/.simai/app.json"
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          tar -C "$out" -czf "$RUNNER_TEMP/site.tgz" .
          sum=$(sha256sum "$RUNNER_TEMP/site.tgz" | cut -d' ' -f1)
          echo "artifact sha256 $sum"
          ssh -i "$RUNNER_TEMP/key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes \
            simai-deploy@201.51.24.222 "deploy-artifact $sum" < "$RUNNER_TEMP/site.tgz"
