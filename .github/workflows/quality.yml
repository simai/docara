name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SIMAI_UI_ROOT: ${{ github.workspace }}/.dependencies/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out the exact Simai Framework distribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: simai/ui
          ref: 4665ecb607b009eae88e77d41cfb46d05d8e4af0
          path: .dependencies/ui
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
          tools: composer
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit
      - run: php ../../docara build production
        env:
          DOCARA_SIMAI_UI_ROOT: ${{ github.workspace }}/.dependencies/ui
        working-directory: docs/site
      - run: php ../../docara verify-static build_production
        working-directory: docs/site
