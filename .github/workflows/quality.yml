name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SIMAI_UI_ROOT: ${{ github.workspace }}/.dependencies/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out the exact SIMAI Framework distribution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: simai/ui
          ref: 32c7a64e457583eaf5a1860590001217a86b5af9
          path: .dependencies/ui
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
          tools: composer
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit
      # The documentation site builds with the Framework Docara bundles.
      - run: env -u SIMAI_UI_ROOT php ../../docara build production
        working-directory: docs/site
      - run: php ../../docara verify-static build_production
        working-directory: docs/site
      # Page weight: HTML plus the CSS, JS, fonts and images each page makes the
      # browser fetch, against the budgets in docs/site/page-weight.json.
      - run: php ../../scripts/verify-page-weight.php build_production --config=page-weight.json
        working-directory: docs/site
