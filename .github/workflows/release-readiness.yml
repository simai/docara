name: Release readiness (no publication)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    runs-on: ubuntu-latest
    env:
      SIMAI_UI_ROOT: ${{ github.workspace }}/.dependencies/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: simai/ui
          ref: 5f1d2e9e5529e8a80d5fcf497dd8d1ff2ab9c864
          path: .dependencies/ui
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit

  deterministic-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source-a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source-b
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
      - name: Build independently from the exact revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          php source-a/scripts/build-release-package.php --revision="$REVISION" --version=0.0.0-ci --tag="ci-$REVISION" --output=source-a/release-out
          php source-b/scripts/build-release-package.php --revision="$REVISION" --version=0.0.0-ci --tag="ci-$REVISION" --output=source-b/release-out
      - name: Verify policy and byte identity
        run: |
          php source-a/scripts/verify-release-package.php source-a/release-out/docara-0.0.0-ci.release-manifest.json
          php source-b/scripts/verify-release-package.php source-b/release-out/docara-0.0.0-ci.release-manifest.json
          cmp source-a/release-out/docara-0.0.0-ci.zip source-b/release-out/docara-0.0.0-ci.zip
          cmp source-a/release-out/docara-0.0.0-ci.release-manifest.json source-b/release-out/docara-0.0.0-ci.release-manifest.json
          cmp source-a/release-out/docara-0.0.0-ci.sha256 source-b/release-out/docara-0.0.0-ci.sha256

  consumer-install:
    # Installs the package into a fresh Composer project from `git archive`
    # of this revision (what a tag's zipball contains), runs init, the three
    # Framework syncs from vendor/simai/docara against the pinned public
    # simai/ui release, then builds and verifies the site. The build itself
    # uses only what the package bundles; no secret is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: simai/ui
          ref: 5f1d2e9e5529e8a80d5fcf497dd8d1ff2ab9c864
          path: .dependencies/ui
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          coverage: none
          tools: composer
      - name: Install into a consumer project, init the default starter, build and verify
        run: php source/scripts/verify-consumer-install.php --source=source
      - name: Same with the Russian minimal starter
        run: php source/scripts/verify-consumer-install.php --source=source --template=minimal --lang=ru
      - name: Same with the showcase starter, after re-running the Framework syncs
        run: php source/scripts/verify-consumer-install.php --source=source --ui=.dependencies/ui --template=showcase --lang=ru

  # No artifact upload, release permission or publication step is allowed here.
